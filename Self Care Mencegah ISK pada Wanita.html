<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Self Care Mencegah ISK pada Wanita</title>

<style>
:root{--t:#2AA79B;--td:#1d7d73;--y:#F4D35E;--bg:#e6f4f2;--paper:#fff;--tx:#1f2d2b;--soft:#eaf6f4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Open Sans',system-ui,sans-serif;font-size:15px}
h1,h2,h3,.h{font-family:Poppins,system-ui,sans-serif;margin:.2em 0}h2{color:var(--td);font-size:1.25em}
#bar{height:5px;background:var(--soft)}#bar i{display:block;height:100%;width:0;background:var(--t);transition:width .3s}
#wrap{max-width:1100px;margin:0 auto;padding:10px}
#book{display:flex;gap:2px;justify-content:center;font-size:calc(1em*var(--z,1));transform-origin:top}
#book.flip{animation:fl .45s}@keyframes fl{from{opacity:.2;transform:perspective(900px) rotateY(-14deg)}}
.pg{display:none;flex:1;min-width:0;background:var(--paper);border-radius:10px;padding:18px;min-height:560px;box-shadow:0 3px 14px #0002;border-top:6px solid var(--t);overflow:auto}
.pg.on{display:block}.num{float:right;font-size:.75em;opacity:.6}
button{font:inherit;cursor:pointer;border:2px solid var(--t);background:var(--paper);color:var(--tx);border-radius:20px;padding:6px 14px;margin:3px}
button.p{background:var(--t);color:#fff}button:disabled{cursor:default}button.ok{background:#bfe8c9;color:#143}button.no{background:#f7c4bf;color:#411}button.sel{background:var(--y);color:#333}
.nav{display:flex;justify-content:center;gap:6px;margin:10px 0;flex-wrap:wrap}
#th{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}#th button{padding:2px 9px;border-radius:6px;font-size:.8em}#th button.cur{background:var(--y);color:#333}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.card{background:var(--soft);border-radius:12px;padding:10px;text-align:center;border:2px solid transparent}.card:hover{border-color:var(--t)}

.q{background:var(--soft);border-radius:10px;padding:8px 10px;margin:8px 0}.q p{margin:0 0 4px}small{display:block;min-height:1em}
table{border-collapse:collapse;width:100%;font-size:.85em}td,th{border:1px solid var(--t);padding:4px}th{background:var(--t);color:#fff}
.tw{overflow-x:auto}input[type=text],input[type=number]{width:100%;padding:4px;border:1px solid var(--t);border-radius:6px;background:var(--paper);color:var(--tx);font:inherit}
.light{display:flex;gap:8px;margin:6px 0;align-items:flex-start}.light b{flex:none;width:18px;height:18px;border-radius:50%;margin-top:3px}
#m{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}#m div{background:var(--paper);max-width:380px;padding:18px;border-radius:14px;border-top:6px solid var(--y)}
.src{font-size:.72em;opacity:.7;margin-top:8px}.bar2{height:12px;background:var(--soft);border-radius:6px}.bar2 i{display:block;height:100%;background:var(--t);border-radius:6px;width:0}
@media print{#bar,.nav,#th,#m{display:none}.pg{display:block!important;box-shadow:none;break-after:page}#book{display:block}}
:root{--paper:#fffdf8;--bg:#edf2f0}
body{font-size:15.5px;line-height:1.65}

button{border-radius:6px;border-width:1.5px;font-weight:600}

.mat{margin:12px 0;text-align:justify}.mat p{margin:.7em 0}.mat h3{border-bottom:1px solid var(--t);padding-bottom:3px}

<div id="m" onclick="this.style.display='none'"><div><h3 id="mt"></h3><p id="mb"></p><button class="p">Tutup</button></div></div>
<script>
const $=s=>document.querySelector(s);let sc=0,an=0,z=1;
function pop(t,b){$('#mt').textContent=t;$('#mb').textContent=b;$('#m').style.display='flex'}
function Q(t,c,e){e=e.replace(/'/g,'’');return `<div class=q><p>${t}</p><div><button onclick="tf(this,true,${c},'${e}')">Benar</button><button onclick="tf(this,false,${c},'${e}')">Salah</button></div><small></small></div>`}
function tf(b,a,c,e){const p=b.parentNode;p.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add(a==c?'ok':'no');p.nextElementSibling.textContent=(a==c?'✔ Tepat! ':'✘ Belum tepat. ')+e}
function ya(b,v){b.parentNode.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add('sel');if(v)sc++;if(++an==4)$('#sc').textContent=sc<=1?'Skor '+sc+'/4: Kebiasaanmu sudah baik. Pertahankan!':sc<=2?'Skor '+sc+'/4: Cukup baik, mulai kurangi menahan pipis.':'Skor '+sc+'/4: Sering menahan pipis. Mulai biasakan ke toilet saat terasa ingin.'}
const st=['Siapkan air bersih / tisu','Bersihkan dari depan ke belakang','Bilas lalu keringkan dengan menepuk'];let ord=0;
function so(b,i){if(i==ord){b.classList.add('ok');b.disabled=true;ord++;$('#os').textContent=ord==3?'✔ Urutan benar!':'Bagus, lanjut langkah berikutnya.'}else $('#os').textContent='✘ Bukan langkah ini dulu, coba lagi.'}
function wc(){const k=+$('#bw').value;$('#wr').textContent=k>0?`Kebutuhan sekitar ${Math.round(k*30)} ml per hari (±${Math.ceil(k*30/250)} gelas @250 ml).`:'Masukkan berat badan.'}
function gl(){const n=document.querySelectorAll('.gl:checked').length;$('#gp').style.width=n/8*100+'%';$('#gt').textContent=n+'/8 gelas'}
function ck(){const n=document.querySelectorAll('.cb:checked').length;$('#ct').textContent=n+'/3 praktik hari ini'}
function sc2(b,a,c,e){const p=b.parentNode;p.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add(a==c?'ok':'no');p.nextElementSibling.textContent=(a==c?'✔ ':'✘ ')+e}
function S(t,c,e){return `<div class=q><p>${t}</p><div><button onclick="sc2(this,0,${c},'${e}')">Rawat diri di rumah</button><button onclick="sc2(this,1,${c},'${e}')">Ke dokter</button></div><small></small></div>`}
const org={Ginjal:'Menyaring darah dan menghasilkan urine.',Ureter:'Dua saluran sempit yang mengalirkan urine dari ginjal ke kandung kemih.',Kandung:'Kandung kemih: menampung urine sampai terasa ingin berkemih.',Uretra:'Saluran pembuang urine ke luar tubuh. Pada wanita pendek (±4 cm), sehingga kuman lebih mudah naik.'};
const hb=[['🧼','Kebersihan intim','Cukup bersihkan bagian luar dengan air bersih. Hindari sabun pewangi, semprotan, dan pembilasan ke dalam vagina.'],['👙','Pakaian dalam','Pilih bahan katun yang menyerap keringat, ganti jika lembap, hindari celana yang terlalu ketat.'],['🥗','Pola makan','Perbanyak sayur dan buah, kurangi gula berlebih dan minuman berkafein tinggi.'],['🏃‍♀️','Aktivitas fisik','Bergerak rutin melancarkan tubuh. Segera ganti pakaian basah setelah berolahraga atau berenang.'],['💞','Setelah seksual','Berkemihlah dalam 30 menit setelahnya untuk membantu membilas kuman dari uretra, lalu bersihkan bagian luar.'],['🩸','Saat menstruasi','Ganti pembalut tiap 4–6 jam, cuci tangan sebelum dan sesudah, dan jaga area tetap kering.']];
const toc=[['🔬','Mengenal ISK',4],['🚿','Cara Cebok',5],['🚻','Jangan Tahan Pipis',6],['💧','Minum Air',7],['🌿','Kebiasaan Lain',8],['🚦','Gejala & Dokter',9],['📅','Rencana Self Care',10],['📖','Pengantar',2]];
const P=[
`<div style="text-align:center;padding-top:30px"><svg width="150" height="150" viewBox="0 0 100 100" fill="none" stroke="#2AA79B" stroke-width="2"><circle cx="50" cy="26" r="13" fill="#F4D35E"/><path d="M30 90c0-30 6-45 20-45s20 15 20 45z" fill="#cdeee9"/><path d="M50 60c-6 0-8 5-8 9s4 7 8 7 8-3 8-7-2-9-8-9z" fill="#fff"/><path d="M50 52v8"/></svg>
<h1 style="color:var(--td);font-size:1.7em">Self Care Mencegah Infeksi Saluran Kemih (ISK) pada Wanita</h1><h3>Panduan Interaktif Perawatan Diri</h3><p>Untuk wanita usia 18–45 tahun</p>
<button class=p onclick="go(1)">Mulai Membaca</button><button onclick="go(2)">Lihat Daftar Isi</button></div>`,
`<span class=num>2</span><h2>Kata Pengantar</h2><p>Infeksi saluran kemih (ISK) adalah salah satu keluhan yang paling sering dialami wanita, namun sebagian besar dapat dicegah lewat kebiasaan sehari-hari. Buku digital ini mengajak Anda memahami tubuh sendiri dan membangun rutinitas perawatan diri yang sederhana, nyaman, dan menyenangkan. Informasi di sini bersifat edukasi dan tidak menggantikan pemeriksaan tenaga kesehatan.</p>
<h3>Petunjuk Penggunaan</h3><table><tr><td>🎯 Kuis</td><td>Uji pemahamanmu</td></tr><tr><td>✅ Checklist</td><td>Centang kebiasaan baik</td></tr><tr><td>📝 Refleksi</td><td>Catat kondisimu</td></tr><tr><td>🔗 Tautan</td><td>Pindah halaman terkait</td></tr></table>
<div class=nav><button onclick="go(0)">← Kembali</button><button class=p onclick="go(2)">Lanjut →</button></div>`,
`<span class=num>3</span><h2>Daftar Isi</h2><div class=grid>${toc.map(c=>`<button class=card onclick="go(${c[2]-1})"><div style="font-size:1.8em">${c[0]}</div>${c[1]}<br><small>hal. ${c[2]}</small></button>`).join('')}</div><p><button class=p onclick="go(3)">Mulai dari Bab 1</button></p>`,
`<span class=num>4</span><h2>Bab 1: Mengenal ISK</h2><p>ISK terjadi saat kuman, paling sering bakteri dari usus, masuk dan berkembang di saluran kemih. Ketuk bagian pada gambar:</p>
<svg viewBox="0 0 200 190" width="100%" style="max-width:240px;display:block;margin:auto"><g fill="#cdeee9" stroke="#2AA79B" stroke-width="2" style="cursor:pointer"><ellipse cx="60" cy="35" rx="16" ry="26" onclick="pop('Ginjal','${org.Ginjal}')"/><ellipse cx="140" cy="35" rx="16" ry="26" onclick="pop('Ginjal','${org.Ginjal}')"/><path d="M62 60 Q70 100 95 118M138 60 Q130 100 105 118" fill="none" onclick="pop('Ureter','${org.Ureter}')"/><circle cx="100" cy="132" r="22" fill="#F4D35E" onclick="pop('Kandung kemih','${org.Kandung}')"/><rect x="95" y="154" width="10" height="30" rx="4" onclick="pop('Uretra','${org.Uretra}')"/></g></svg>
<p>Faktor risiko: <span class=chip>Uretra pendek</span><span class=chip>Menahan pipis</span><span class=chip>Kurang minum</span><span class=chip>Cebok keliru</span><span class=chip>Setelah seksual</span><span class=chip>Pakaian lembap</span></p>
<h3>Kuis Kilat</h3>${Q('ISK hanya dialami wanita.',false,'Pria juga bisa, tetapi wanita lebih sering karena uretra lebih pendek.')}${Q('Kurang minum dapat meningkatkan risiko ISK.',true,'Urine yang jarang dibuang memberi kuman waktu berkembang.')}<p class=src>Sumber: WHO, EAU, CDC, Kemenkes RI</p>`,
`<span class=num>5</span><h2>Bab 2: Cara Cebok yang Benar</h2><p>Arah yang benar adalah <b>depan → belakang</b>, agar kuman dari anus tidak terbawa ke uretra.</p>
<div class=grid><div class=card>①<br>Siapkan air / tisu bersih</div><div class=card>②<br>Bersihkan depan → belakang</div><div class=card>③<br>Bilas &amp; keringkan</div></div>
<h3>✅ Praktik Hari Ini</h3><label><input type=checkbox class=cb onchange=ck()> Cebok depan ke belakang</label><br><label><input type=checkbox class=cb onchange=ck()> Mengeringkan area intim</label><br><label><input type=checkbox class=cb onchange=ck()> Mencuci tangan setelahnya</label><br><b id=ct>0/3 praktik hari ini</b>
<h3>🎯 Urutkan Langkah</h3><p>Ketuk langkah sesuai urutan yang benar:</p>${[2,0,1].map(i=>`<button onclick="so(this,${i})">${st[i]}</button>`).join('')}<small id=os></small>`,
`<span class=num>6</span><h2>Bab 3: Jangan Tahan Pipis!</h2><p>Frekuensi berkemih normal sekitar <b>4–8 kali sehari</b>. Urine yang tertahan lama membuat kuman lebih mudah berkembang.</p>
<div class=bar2><i style="width:100%"></i></div><small>4 – 8 × / hari (normal)</small>
<h3>Apakah Kamu Sering Menahan Pipis?</h3>${['Saya menunda ke toilet saat sedang sibuk.','Saya menahan pipis saat bepergian.','Saya jarang ke toilet saat di kantor/sekolah.','Saya enggan memakai toilet umum.'].map(t=>`<div class=q><p>${t}</p><button onclick="ya(this,1)">Ya</button><button onclick="ya(this,0)">Tidak</button></div>`).join('')}<b id=sc></b>
<p><span class=chip>Tips</span> Berkemih segera saat terasa ingin dan kosongkan kandung kemih sampai tuntas.</p>`,
`<span class=num>7</span><h2>Bab 4: Minum Air yang Baik &amp; Benar</h2><p>Hidrasi cukup membantu membilas kuman dari saluran kemih. Urine kuning pucat menandakan cairan cukup.</p>
<div class=q>Berat badan (kg): <input type=number id=bw min=1 max=200 oninput=wc()><b id=wr>Masukkan berat badan.</b></div>
<div class=tw><table><tr><th>Baik</th><th>Batasi</th></tr><tr><td>Air putih, air infus buah, teh herbal tanpa gula</td><td>Soda, minuman manis, kopi berlebih, alkohol</td></tr></table></div>
<h3>✅ 8 Gelas Sehari</h3>${[...Array(8)].map(()=>'<label><input type=checkbox class=gl onchange=gl()>💧</label> ').join('')}<div class=bar2><i id=gp></i></div><small id=gt>0/8 gelas</small>
<p class=src>Perkiraan umum ±30 ml/kg BB. Kebutuhan dapat berbeda pada kondisi tertentu, tanyakan tenaga kesehatan.</p>`,
`<span class=num>8</span><h2>Bab 5: Kebiasaan Pendukung Lainnya</h2><p>Ketuk kartu untuk penjelasan.</p><div class=grid>${hb.map(h=>`<button class=card onclick="pop('${h[1]}','${h[2]}')"><div style="font-size:1.8em">${h[0]}</div>${h[1]}</button>`).join('')}</div>`,
`<span class=num>9</span><h2>Bab 6: Kenali Gejala &amp; Kapan ke Dokter</h2>
<svg viewBox="0 0 100 130" width="110" style="float:right;margin:0 0 6px 8px"><g stroke="#2AA79B" stroke-width="2" fill="#cdeee9"><circle cx="50" cy="16" r="11"/><path d="M28 120V50q0-12 12-12h20q12 0 12 12v70z"/></g><circle cx="50" cy="82" r="6" fill="#e0b400" onclick="pop('Perut bawah','Nyeri atau tekanan di area ini dapat menandakan ISK.')"/><circle cx="38" cy="58" r="5" fill="#d33" onclick="pop('Pinggang','Nyeri pinggang disertai demam perlu segera diperiksa.')"/></svg>
<div class=light><b style="background:#3a3"></b><span><b>Hijau:</b> tanpa keluhan. Lanjutkan rutinitas self care.</span></div>
<div class=light><b style="background:#e0b400"></b><span><b>Kuning:</b> perih saat berkemih, sering ingin pipis, urine keruh. Minum cukup dan periksa ke dokter bila tidak membaik dalam 1–2 hari.</span></div>
<div class=light><b style="background:#d33"></b><span><b>Merah:</b> demam/menggigil, nyeri pinggang, urine berdarah, mual muntah, atau sedang hamil. Segera ke fasilitas kesehatan.</span></div>
<h3>Kenali Gejala, Ambil Keputusan</h3>${S('Tidak ada keluhan, hanya ingin menjaga kesehatan.',0,'Cukup lanjutkan kebiasaan baik.')}${S('Perih saat pipis dan sering ingin berkemih sejak 3 hari.',1,'Gejala menetap perlu pemeriksaan dan pengobatan yang tepat.')}${S('Demam, nyeri pinggang, dan mual.',1,'Tanda infeksi bisa sudah ke ginjal: segera ke dokter.')}`,
`<span class=num>10</span><h2>Bab 7: Rencana Self Care</h2><p>Centang kebiasaan harianmu. Data tersimpan di perangkat ini.</p><div class=tw><table id=jt><tr><th>Hari</th><th>💧 Minum</th><th>🚿 Cebok</th><th>🚻 Tidak tahan</th><th>📝 Catatan</th></tr></table></div>
<div class=nav><button class=p onclick="window.print()">Cetak / Simpan PDF</button><button onclick="go(0)">Baca Ulang dari Awal</button><button onclick="sh()">Bagikan ke Teman</button></div>
<p><i>Tubuhmu layak dirawat. Langkah kecil yang konsisten hari ini adalah perlindungan terbaik untuk esok. Kamu hebat! 💚</i></p>`];
const MB=(tj,it)=>`<div class=tuj><b>Tujuan Pembelajaran</b><br>${tj}</div><div class=mat><h3>Materi</h3>${it.map(([a,b],i)=>`<p><b>${String.fromCharCode(65+i)}. ${a}</b><br>${b}</p>`).join('')}</div>`;
const M={1:`<div class=tuj><b>Capaian Pembelajaran</b><ol style="margin:4px 0"><li>Menjelaskan pengertian, penyebab, dan faktor risiko ISK.</li><li>Menerapkan teknik cebok dan kebiasaan berkemih yang benar.</li><li>Mengatur asupan cairan sesuai kebutuhan.</li><li>Mengenali gejala dan menentukan waktu berkonsultasi ke tenaga kesehatan.</li></ol></div>`,
3:MB('Menjelaskan pengertian, penyebab, dan faktor risiko ISK.',[['Pengertian','Infeksi saluran kemih (ISK) adalah infeksi akibat mikroorganisme pada bagian mana pun dari saluran kemih. Infeksi pada uretra disebut uretritis, pada kandung kemih disebut sistitis, dan pada ginjal disebut pielonefritis.'],['Penyebab','Penyebab tersering adalah bakteri Escherichia coli, yaitu bakteri normal di usus yang berpindah dari area anus ke lubang uretra lalu naik ke kandung kemih.'],['Mengapa wanita lebih rentan','Uretra wanita lebih pendek (sekitar 4 cm) dan letaknya berdekatan dengan anus dan vagina, sehingga bakteri lebih mudah mencapai kandung kemih.']]),
4:MB('Menerapkan teknik membersihkan area kemaluan setelah berkemih dan buang air besar.',[['Prinsip arah','Selalu bersihkan dari depan (uretra) ke belakang (anus) agar bakteri dari anus tidak terbawa ke saluran kemih.'],['Air atau tisu','Air bersih mengalir lebih dianjurkan. Bila memakai tisu, pilih yang bersih dan tanpa pewangi, lalu keringkan dengan menepuk, bukan menggosok.'],['Yang perlu dihindari','Hindari pembilasan ke dalam vagina (douching) serta sabun berpewangi atau antiseptik kuat, karena dapat mengganggu bakteri baik (laktobasilus) yang melindungi area kewanitaan.']]),
5:MB('Menjelaskan alasan berkemih tidak boleh ditahan dan menerapkan pola berkemih sehat.',[['Fungsi berkemih','Berkemih secara teratur membilas bakteri yang masuk ke uretra sebelum sempat berkembang.'],['Dampak menahan','Urine yang tertahan lama menjadi media berkembangnya bakteri dan membuat otot kandung kemih meregang berlebihan.'],['Anjuran praktis','Berkemihlah saat terasa ingin, kosongkan kandung kemih sampai tuntas tanpa mengejan, dan jangan menunda dalam rentang waktu yang lama.']]),
6:MB('Menghitung dan memenuhi kebutuhan cairan harian.',[['Peran cairan','Asupan cairan yang cukup meningkatkan produksi urine sehingga bakteri lebih sering terbilas. Uji klinis pada wanita dengan ISK berulang dan asupan cairan rendah menunjukkan bahwa menambah minum air dapat menurunkan kekambuhan (Hooton dkk., 2018).'],['Cara minum','Minumlah bertahap sepanjang hari, bukan sekaligus dalam jumlah besar. Tambahkan sesuai aktivitas dan cuaca.'],['Penanda kecukupan','Urine berwarna kuning pucat menandakan cairan cukup; urine pekat menandakan perlu minum lebih banyak.']]),
8:MB('Menjelaskan kebiasaan pendukung yang menjaga kesehatan saluran kemih.',[['Prinsip umum','Kebiasaan ini bertujuan menjaga keseimbangan flora normal, kebersihan, dan kekeringan area intim, karena lingkungan lembap mempermudah pertumbuhan kuman.'],['Penerapan','Pilih satu kebiasaan yang paling mudah dimulai, lakukan selama satu minggu, lalu tambahkan kebiasaan berikutnya.']]),
9:MB('Membedakan gejala ringan dan tanda bahaya serta mengambil keputusan yang tepat.',[['Gejala ISK bawah','Rasa perih atau terbakar saat berkemih, sering ingin berkemih, sulit menahan, nyeri di perut bagian bawah, serta urine keruh atau berbau.'],['Tanda ISK atas','Demam atau menggigil, nyeri pinggang, mual atau muntah. Kondisi ini menandakan infeksi mungkin telah mencapai ginjal.'],['Kelompok yang perlu lebih waspada','Wanita hamil, penderita diabetes, dan wanita dengan ISK berulang (dua kali atau lebih dalam enam bulan).'],['Pengobatan','Jangan membeli antibiotik tanpa resep. Penggunaan yang tidak tepat memicu resistensi antibiotik dan dapat menyamarkan gejala.']]),
10:MB('Menyusun rencana self care pribadi yang konsisten.',[['Prinsip pembentukan kebiasaan','Mulailah dari target kecil, lakukan pada waktu yang sama setiap hari, dan catat perkembangan agar mudah dievaluasi.'],['Refleksi mingguan','Setelah tujuh hari, tinjau kebiasaan yang sudah konsisten dan yang masih sulit, lalu tetapkan satu perbaikan untuk minggu berikutnya.']])};
const R=`<h3>Daftar Pustaka</h3><p class=ref>Bonkat, G., dkk. EAU Guidelines on Urological Infections. European Association of Urology.</p><p class=ref>Centers for Disease Control and Prevention (CDC). Urinary Tract Infection (informasi untuk publik dan tenaga kesehatan).</p><p class=ref>Flores-Mireles, A. L., dkk. (2015). Urinary tract infections: epidemiology, mechanisms of infection and treatment options. Nature Reviews Microbiology, 13(5), 269–284.</p><p class=ref>Hooton, T. M., dkk. (2018). Effect of increased daily water intake in premenopausal women with recurrent urinary tract infections. JAMA Internal Medicine, 178(11), 1509–1515.</p><p class=ref>Kementerian Kesehatan Republik Indonesia. Materi edukasi kesehatan dan perilaku hidup bersih dan sehat (kemkes.go.id).</p><p class=ref>World Health Organization (WHO). Materi kesehatan dan antimicrobial resistance (who.int).</p>`;
const bk=$('#book');P.forEach((h,i)=>{const d=document.createElement('section');d.className='pg';d.innerHTML=h;const t=d.querySelector('h2');if(t&&M[i])t.insertAdjacentHTML('afterend',M[i]);if(i==9)d.insertAdjacentHTML('beforeend',R);bk.appendChild(d)});
const pg=[...bk.children],th=$('#th');pg.forEach((_,i)=>{const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>go(i);th.appendChild(b)});
const jt=$('#jt');let J={};try{J=JSON.parse(localStorage.getItem('isk')||'{}')}catch(e){}
['Sen','Sel','Rab','Kam','Jum','Sab','Min'].forEach((d,r)=>{const tr=jt.insertRow();tr.innerHTML=`<td>${d}</td>`+[0,1,2].map(c=>`<td><input type=checkbox data-k=${r}_${c}></td>`).join('')+`<td><input type=text data-k=${r}_n></td>`});
jt.querySelectorAll('input').forEach(i=>{const v=J[i.dataset.k];if(i.type=='checkbox')i.checked=!!v;else if(v)i.value=v;i.onchange=i.oninput=()=>{J[i.dataset.k]=i.type=='checkbox'?i.checked:i.value;try{localStorage.setItem('isk',JSON.stringify(J))}catch(e){}}});
function sh(){const u=location.href;if(navigator.share)navigator.share({title:document.title,url:u}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>pop('Tertaut','Tautan disalin.')).catch(()=>pop('Bagikan',u));else pop('Bagikan',u)}
const wide=()=>matchMedia('(min-width:820px)').matches;let cur=0;
function start(p){return !wide()?p:p==0?0:p%2?p:p-1}
function go(p){cur=Math.max(0,Math.min(9,p));const s=start(cur);pg.forEach((e,i)=>e.classList.toggle('on',i==s||(wide()&&s>0&&i==s+1)));[...th.children].forEach((b,i)=>b.classList.toggle('cur',i==cur));$('#bar i').style.width=(cur+1)*10+'%';bk.classList.remove('flip');void bk.offsetWidth;bk.classList.add('flip');scrollTo(0,0)}
function next(){const s=start(cur);go(!wide()?cur+1:s==0?1:s+2)}
function prev(){const s=start(cur);go(!wide()?cur-1:s<=1?0:s-2)}
function zm(d){z=Math.max(.8,Math.min(1.5,z+d));bk.style.setProperty('--z',z)}
let tx=0;bk.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});bk.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>80)d<0?next():prev()});
addEventListener('resize',()=>go(cur));go(0);
